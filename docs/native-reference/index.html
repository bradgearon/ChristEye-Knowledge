<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ChristEye Anaiero — Native C++ API</title>
<meta name="description" content="Searchable C++20 native API documentation with grouped classes, interfaces, functions and source-linked declarations">
<style>
:root{color-scheme:dark;--bg:#081321;--panel:#10243a;--edge:#31536a;--ink:#e7f4ff;--muted:#a4bccb;--sea:#4addc6}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 system-ui,Segoe UI,sans-serif}a{color:var(--sea);text-decoration:none}a:hover{text-decoration:underline}button,input{font:inherit}button{cursor:pointer}
header{display:flex;align-items:center;gap:20px;flex-wrap:wrap;padding:16px 25px;background:#0b1d30;border-bottom:1px solid var(--edge)}
.brand{color:var(--ink);font-size:19px;font-weight:800}.brand small{display:block;font-size:11px;color:var(--muted);font-weight:400}
#search{flex:1;min-width:min(360px,100%);max-width:800px;background:#142b43;border:1px solid #385b75;border-radius:9px;padding:11px 13px;color:white}
.layout{display:grid;grid-template-columns:315px minmax(0,1fr);min-height:calc(100vh - 80px)}
aside{padding:17px;border-right:1px solid var(--edge);height:calc(100vh - 80px);position:sticky;top:0;overflow:auto}
main{max-width:1450px;min-width:0;padding:32px clamp(20px,4vw,60px)}
h1{font-size:clamp(27px,3vw,41px);line-height:1.2;margin:7px 0 14px}h2{font-size:20px;margin:28px 0 12px}h3{font-size:17px;margin:0 0 6px}
.muted{color:var(--muted)}.meta{font-size:11px;color:#92b2c0;display:block}.group{font-size:11px;color:#79d9c6;text-transform:uppercase;letter-spacing:.1em;font-weight:700;margin:17px 7px 6px}
nav button{display:block;width:100%;text-align:left;border:0;border-radius:8px;background:transparent;color:#d8eaf7;padding:10px;overflow-wrap:anywhere}
nav button:hover,nav button.active{background:#1b3f50}.tabs{display:flex;flex-wrap:wrap;gap:7px;margin:14px 0}
.tabs button,.action{background:#16354a;color:#ddf5f1;border:1px solid #40657a;padding:7px 11px;border-radius:8px}.tabs button.active{border-color:var(--sea);background:#124944}
.pills{display:flex;flex-wrap:wrap;gap:9px;margin:18px 0}.pill{border:1px solid var(--edge);border-radius:50px;padding:5px 11px;color:#bdd5e2;font-size:12px}
.card{border:1px solid var(--edge);background:var(--panel);border-radius:11px;padding:18px 20px;margin:13px 0;overflow-wrap:anywhere}
.card h3 span{font-size:12px;color:var(--muted);font-weight:400}code{color:#ddf4ee;font-family:Consolas,monospace;overflow-wrap:anywhere}
.member{padding:10px 0;border-top:1px solid #30495f}.source{margin-left:10px;font-size:12px}
.desc{font-size:12px;color:#9fbaca;margin-top:4px}.note{border-left:3px solid #e5b981;background:#152d40;padding:13px 17px;margin:20px 0}
#status{font-size:12px;color:var(--muted)}.empty{padding:20px;color:var(--muted)}
@media(max-width:820px){.layout{display:block}aside{height:auto;max-height:290px;position:static;border-right:0;border-bottom:1px solid var(--edge)}main{padding:23px}}
</style></head>
<body><header><a class="brand" href="../">✦ Anaiero<small>Native C++20 API Reference</small></a><input type="search" id="search" placeholder="Search file, namespace, class or method…" aria-label="Search native API"><a href="https://github.com/bradgearon/ChristEye-Knowledge">GitHub</a></header>
<div class="layout"><aside><div id="status">Loading source manifest…</div><div class="tabs" id="tabs"></div><nav id="navigation"></nav></aside><main id="content"><h1>Native C++ API</h1><p class="muted">Select a header to browse its types and callable declarations.</p></main></div>
<script>
"use strict";
const $=id=>document.getElementById(id),escapeHTML=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const branch="design/v3.1-biological-systems-rigorous-spec",repo="bradgearon/ChristEye-Knowledge";
const rawPath=p=>"https://raw.githubusercontent.com/"+repo+"/"+branch+"/"+p;
const sourceLink=(p,n)=>"https://github.com/"+repo+"/blob/"+branch+"/"+p+"#L"+n;
const layers={application:"Application",contracts:"Contracts and interfaces",models:"Models and data",services:"Services",infrastructure:"Infrastructure",examples:"Executables and examples"};
let files=[],filter="",mode="files",active=-1,loadedCount=0;
function readSource(src,path) {
 const lines=src.split(/\r?\n/),types=[],members=[],functions=[],constants=[];let depth=0,stack=[],note="";
 const skip=/^(?:return|if|for|while|switch|catch|else|throw|static_assert|using|typedef|#|\/\/|\*)\b/;
 for(let i=0;i<lines.length;i++){
  const s=lines[i].trim();if(s.startsWith("//")){note=s.slice(2).trim().slice(0,220);continue}
  if(skip.test(s)){if(!s.startsWith("template"))note="";continue}
  const m=s.match(/\b(enum class|class|struct|enum)\s+([A-Za-z_]\w*)\b/);
  if(m&&!s.startsWith("friend ")){types.push({kind:m[1],name:m[2],line:i+1,note});if(s.includes("{"))stack.push({name:m[2],depth:depth+1})}
  const f=s.match(/(?:^|[\s:*&>])(~?[A-Za-z_]\w*|operator(?:==|!=|<=|>=|<=>|\[\]|\(\)|[+\-*/=<>!]))\s*\(/);
  if(f && (s.includes(";")||s.includes("{")||s.includes("noexcept")||s.includes("override")) &&
     !/^(?:if|for|while|switch|return|throw|static_assert)\s*\(/.test(s)){
     const name=f[1],prefix=s.slice(0,f.index).trim();
     const owner=stack.length?stack[stack.length-1].name:"";
     const likely=/\b(virtual|static|inline|explicit|constexpr|consteval|auto|void|bool|int|unsigned|std::)\b/.test(prefix)||
         /[&*:<>]\s*$/.test(prefix)||owner===name||"~"+owner===name||/^[A-Z][\w:<>]*\s*$/.test(prefix);
     if(likely){const item={name,owner,signature:s.slice(0,300),line:i+1,note};(owner?members:functions).push(item)}
  }
  const c=s.match(/(?:constexpr|constinit)\s+[^;=]+\b([A-Za-z_]\w*)\s*(?:=|;)/);
  if(c)constants.push({name:c[1],line:i+1,note});
  const clean=lines[i].replace(/\/\/.*$/,"").replace(/"(?:\\.|[^"\\])*"/g,'""');
  depth+=(clean.match(/\{/g)||[]).length-(clean.match(/\}/g)||[]).length;
  while(stack.length&&depth<stack[stack.length-1].depth)stack.pop();
  if(s&&!s.startsWith("template"))note="";
 }
 return {types,members,functions,constants,lines:lines.length};
}
const dedup=(arr,key)=>[...new Map(arr.map(x=>[key(x),x])).values()];
async function ensure(file){
 if(file.declarations)return file.declarations;if(file.pending)return file.pending;
 file.pending=fetch(rawPath(file.path)).then(r=>{if(!r.ok)throw Error("Source HTTP "+r.status);return r.text()})
   .then(s=>{file.declarations=readSource(s,file.path);loadedCount++;return file.declarations})
   .finally(()=>delete file.pending);
 return file.pending;
}
function renderNav(){
 const nav=$("navigation");nav.innerHTML="";let group="";
 files.forEach((f,i)=>{
  const d=f.declarations;
  const hits=(f.path+" "+(d?d.types.map(t=>t.name).concat(d.members.map(m=>m.name),d.functions.map(m=>m.name)).join(" "):"")).toLowerCase().includes(filter);
  if(!hits)return;
  if(mode==="classes"&&d&&!d.types.some(t=>/class|struct/.test(t.kind)))return;
  if(mode==="functions"&&d&&!d.functions.length)return;
  if(f.layer!==group){group=f.layer;const h=document.createElement("div");h.className="group";h.textContent=layers[group]||group;nav.append(h)}
  const b=document.createElement("button");b.className=active===i?"active":"";b.innerHTML=escapeHTML(f.path.split("/").pop())+(d?'<small class="meta">'+d.types.length+" types · "+(d.members.length+d.functions.length)+" callables</small>":'<small class="meta">'+escapeHTML(f.path.replace("native/",""))+"</small>");
  b.onclick=()=>showFile(i);nav.append(b)
 });
 if(!nav.children.length)nav.innerHTML='<div class="empty">No matches. Type names become searchable as headers are indexed.</div>';
}
function renderTabs(){
 $("tabs").innerHTML=[["files","Files"],["classes","Classes"],["functions","Functions"]].map(([v,t])=>'<button class="'+(v===mode?"active":"")+'" data-mode="'+v+'">'+t+"</button>").join("");
 $("tabs").querySelectorAll("button").forEach(b=>b.onclick=()=>{mode=b.dataset.mode;renderTabs();renderNav()});
}
function link(f,n){return '<a class="source" target="_blank" rel="noopener" href="'+escapeHTML(sourceLink(f.path,n))+'">line '+n+"</a>"}
function renderFile(f,d){
 const t=dedup(d.types,x=>x.name+"|"+x.line);
 let html='<div class="muted">NATIVE / '+escapeHTML(f.layer.toUpperCase())+'</div><h1>'+escapeHTML(f.path.split("/").pop())+'</h1><p><code>'+escapeHTML(f.path)+'</code></p>'+
  '<div class="pills"><span class="pill">'+t.length+' types</span><span class="pill">'+d.members.length+' member declarations</span><span class="pill">'+d.functions.length+' free function declarations</span></div>'+
  '<p><a target="_blank" rel="noopener" href="'+escapeHTML(sourceLink(f.path,1))+'">View full original source on GitHub</a></p>';
 if(t.length)html+="<h2>Classes and data types</h2>";
 for(const item of t){
  const related=dedup(d.members.filter(m=>m.owner===item.name&&m.line>=item.line),m=>m.line+"|"+m.signature);
  html+='<div class="card"><h3>'+escapeHTML(item.name)+' <span>'+escapeHTML(item.kind)+"</span>"+link(f,item.line)+"</h3>"+(item.note?'<div class="desc">'+escapeHTML(item.note)+"</div>":"")+
   related.map(m=>'<div class="member"><code>'+escapeHTML(m.signature)+"</code>"+link(f,m.line)+(m.note?'<div class="desc">'+escapeHTML(m.note)+"</div>":"")+"</div>").join("")+"</div>";
 }
 if(d.functions.length)html+='<h2>Free functions</h2><div class="card">'+dedup(d.functions,m=>m.line+"|"+m.signature).map(m=>'<div class="member"><code>'+escapeHTML(m.signature)+"</code>"+link(f,m.line)+"</div>").join("")+"</div>";
 if(d.constants.length)html+='<h2>Constants</h2><div class="card">'+dedup(d.constants,c=>c.line+"|"+c.name).map(c=>'<div class="member"><code>'+escapeHTML(c.name)+"</code>"+link(f,c.line)+"</div>").join("")+"</div>";
 if(!t.length&&!d.functions.length)html+='<div class="note">This header contains declarations or implementation details not extracted by the lightweight index. Open the original source for the complete definition.</div>';
 $("content").innerHTML=html;
}
async function showFile(i){
 active=i;renderNav();const f=files[i];$("content").innerHTML="<h1>"+escapeHTML(f.path.split("/").pop())+'</h1><p class="muted">Loading native declarations…</p>';
 location.hash="file-"+i;
 try{const d=await ensure(f);if(active===i)renderFile(f,d);renderNav();updateStatus()}
 catch(e){$("content").innerHTML='<h1>'+escapeHTML(f.path.split("/").pop())+'</h1><p class="muted">Source could not be loaded: '+escapeHTML(e.message)+'</p><a target="_blank" rel="noopener" href="'+escapeHTML(sourceLink(f.path,1))+'">Open source on GitHub</a>'}
}
function updateStatus(){$("status").textContent=files.length+" native files · "+loadedCount+" indexed"}
async function indexAll(){
 let cursor=0;await Promise.all(Array.from({length:8},async()=>{while(cursor<files.length){const f=files[cursor++];try{await ensure(f)}catch(e){}updateStatus()}}));
 renderNav();
}
$("search").addEventListener("input",e=>{filter=e.target.value.trim().toLowerCase();renderNav()});
fetch("./source-index.json").then(r=>{if(!r.ok)throw Error("manifest HTTP "+r.status);return r.json()}).then(index=>{
 files=index.files;renderTabs();renderNav();updateStatus();
 $("content").innerHTML='<h1>Browse the Anaiero native API</h1><p class="muted">Source-linked C++20 contracts, services, infrastructure and application interfaces, organized by layer and file. Choose a header to inspect classes, members and methods.</p><div class="pills"><span class="pill">'+files.length+' native source files</span><span class="pill">Windows + Linux C++20</span><span class="pill">Source-derived documentation</span></div><div class="note">Declarations are indexed from the current native development branch; source links point to that branch. The branch must be merged into main separately before source links can be changed to main.</div><p><a class="action" href="https://github.com/bradgearon/ChristEye-Knowledge/tree/design/v3.1-biological-systems-rigorous-spec/native">Explore native source tree</a></p>';
 const match=location.hash.match(/^#file-(\d+)$/);if(match&&files[+match[1]])showFile(+match[1]);indexAll();
}).catch(e=>{$("status").textContent="Manifest error";$("content").textContent=e.message});
</script></body></html>
