  <script>
  (async function(){
    try {
      async function expanded(name){
        const response=await fetch(name);
        if(!response.ok)throw new Error('Could not load '+name+' (HTTP '+response.status+')');
        const bytes=new Uint8Array(await response.arrayBuffer());
        if(bytes[0]!==31||bytes[1]!==139)return new TextDecoder('utf-8').decode(bytes);
        if(!('DecompressionStream' in window))throw new Error('This browser does not support the compressed reference data. Please use an up-to-date browser.');
        const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
        return await new Response(stream).text();
      }
      const source=await expanded('data.js.gz');
      const script=document.createElement('script');
      script.textContent=source;
      document.body.appendChild(script);
      const app=document.createElement('script');
      app.src='app.js';
      app.onerror=function(){throw new Error('Could not load app.js')};
      document.body.appendChild(app);
      document.addEventListener('click',async function(event){
        const link=event.target.closest('a.download-link');
        if(!link)return;
        event.preventDefault();
        link.style.pointerEvents='none';
        try {
          const text=await expanded('anaiero-native-reference.html.gz');
          const blob=new Blob([text],{type:'text/html;charset=utf-8'});
          const url=URL.createObjectURL(blob);
          const a=document.createElement('a');a.href=url;a.download='anaiero-native-reference.html';
          document.body.appendChild(a);a.click();a.remove();
          setTimeout(()=>URL.revokeObjectURL(url),60000);
        }catch(error){alert('Offline reference download failed: '+error.message)}
        finally{link.style.pointerEvents=''}
      },true);
    } catch(error){
      document.getElementById('document').innerHTML='<article style="margin:2rem;max-width:50rem"><h1>Could not load native reference</h1><p></p><a href="https://github.com/bradgearon/ChristEye-Knowledge">Open the source repository</a></article>';
      document.querySelector('#document p').textContent=error.message;
      console.error(error);
    }
  })();
  </script>
