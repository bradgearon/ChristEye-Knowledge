name: Anaiero AVM media schemas and route admission
on:
  push:
    paths:
      - 'anaiero/media.py'
      - 'schemas/software/media_*.schema.json'
      - 'examples/avm_*.json'
      - 'tests/test_media_module_contracts.py'
      - '.github/workflows/media-contracts.yml'
  pull_request:
    paths:
      - 'anaiero/media.py'
      - 'schemas/software/media_*.schema.json'
      - 'examples/avm_*.json'
      - 'tests/test_media_module_contracts.py'
      - '.github/workflows/media-contracts.yml'
permissions:
  contents: read
jobs:
  media-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install JSON Schema contract validator
        run: python -m pip install 'jsonschema>=4.18,<5'
      - name: Execute AVM manifest and routing contract tests
        run: python -m unittest discover -s tests -p 'test_media_module_contracts.py' -v
