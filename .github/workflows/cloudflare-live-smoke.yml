name: Anaiero live production smoke test
on:
  workflow_dispatch:
    inputs:
      require_interest:
        description: 'Require interest-registration configuration to be enabled'
        type: boolean
        required: true
        default: false
permissions:
  contents: read
jobs:
  check-public-domain:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check anaiero.io homepage and public GET endpoints
        if: ${{ !inputs.require_interest }}
        working-directory: website/app
        run: node scripts/launch-preflight.mjs --live
      - name: Require registered-interest service to be enabled
        if: ${{ inputs.require_interest }}
        working-directory: website/app
        run: node scripts/launch-preflight.mjs --live --require-interest
