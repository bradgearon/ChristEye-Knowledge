name: SIM3.1 Replay Viewer Contracts
on:
  push:
    paths:
      - 'tools/sim3_viewer/**'
      - 'tests/test_sim31_viewer_*'
      - 'schemas/software/colony_lab_*.schema.json'
      - '.github/workflows/sim31-replay.yml'
  pull_request:
    paths:
      - 'tools/sim3_viewer/**'
      - 'tests/test_sim31_viewer_*'
      - 'schemas/software/colony_lab_*.schema.json'
      - '.github/workflows/sim31-replay.yml'
permissions:
  contents: read
jobs:
  viewer-replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate browser JavaScript syntax
        run: |
          node --check tools/sim3_viewer/replay_contract.js
          node --check tools/sim3_viewer/viewer.js
      - name: Validate fixture and negative replay cases
        run: node tests/test_sim31_viewer_contract.cjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install schema validator
        run: python -m pip install 'jsonschema>=4.18,<5'
      - name: Validate JSON schemas
        run: python -m unittest discover -s tests -p test_sim31_viewer_schema.py -v
      - name: Build native SIM3.1 runner
        run: |
          cmake -S native -B build/sim31-lab -DCE_WIND_BUILD_TESTS=OFF
          cmake --build build/sim31-lab --target ce_colony_runner ce_colony_lab --parallel 2
      - name: Validate native-generated viewer frames and overlays
        run: |
          build/sim31-lab/ce_colony_runner step examples/connected-gardens-lab.cev build/sim31-lab/run-state 5
          build/sim31-lab/ce_colony_lab export examples/connected-gardens-lab.cev build/sim31-lab/run-state build/sim31-lab/replay.ndjson
          build/sim31-lab/ce_colony_lab overlay examples/connected-gardens-lab.cev build/sim31-lab/run-state build/sim31-lab/overlay.ndjson
          node tools/sim3_viewer/validate_replay.cjs build/sim31-lab/replay.ndjson build/sim31-lab/overlay.ndjson
