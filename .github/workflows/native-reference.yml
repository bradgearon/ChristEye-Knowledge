name: Anaiero native API reference
on:
  pull_request:
    paths: ["tools/native_docs/**", ".github/workflows/native-reference.yml"]
  push:
    branches: [main]
    paths: ["tools/native_docs/**", ".github/workflows/native-reference.yml"]
  workflow_dispatch:
  schedule:
    - cron: "23 5 * * *"
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: anaiero-native-reference
  cancel-in-progress: false
jobs:
  generate:
    name: Verify native build and generate source-pinned reference
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/checkout@v4
        with:
          repository: bradgearon/ChristEye-Knowledge
          ref: feature/anaiero-environment-calibration
          path: .native-source
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deterministic C++ parser
        run: python -m pip install --disable-pip-version-check -r tools/native_docs/requirements.txt
      - name: Verify generator and browser syntax
        run: |
          python -m py_compile tools/native_docs/generate.py tools/native_docs/verify_output.py
          node --check tools/native_docs/ui/reference.js
          python -m unittest discover -s tools/native_docs/tests -v
      - name: Configure native compiler gate
        run: cmake -S .native-source/native -B /tmp/anaiero-doc-build -DCMAKE_BUILD_TYPE=Release -DANAIERO_CONTROLLER_ONLY=ON -DCE_WIND_BUILD_TESTS=OFF -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
      - name: Build the native C++20 controller
        run: cmake --build /tmp/anaiero-doc-build --config Release --parallel 2
      - name: Confirm compiler database
        run: test -s /tmp/anaiero-doc-build/compile_commands.json
      - name: Generate and verify immutable API snapshots
        run: |
          python tools/native_docs/generate.py --source .native-source --source-ref feature/anaiero-environment-calibration --strict
          python tools/native_docs/verify_output.py --site docs/native-reference
          python tools/native_docs/generate.py --source .native-source --source-ref feature/anaiero-environment-calibration --strict --check
          node --check docs/native-reference/reference.js
      - uses: actions/upload-artifact@v4
        with:
          name: native-reference-validation
          path: |
            docs/native-reference/versions.json
            docs/native-reference/data/*/manifest.json
            docs/native-reference/data/*/warnings.json
          retention-days: 14
      - name: Commit successfully validated docs on main
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/native-reference
          if ! git diff --cached --quiet; then
            git commit -m "docs(native): update source-pinned API reference [skip ci]"
            git push origin HEAD:main
          fi
      - name: Upload generated Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs
  deploy:
    name: Publish generated docs to GitHub Pages
    if: github.event_name != 'pull_request'
    needs: generate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
