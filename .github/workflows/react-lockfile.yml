name: Generate React Portal Dependency Lockfile
on:
  push:
    branches: [site/react-interactive-portal-v1]
    paths:
      - '.github/workflows/react-lockfile.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  lockfile:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/site/react-interactive-portal-v1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve lockfile
        working-directory: website/app
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit reproducible dependency lock
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add website/app/package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "build: lock React portal dependencies"
            git push origin HEAD:refs/heads/site/react-interactive-portal-v1
          fi
