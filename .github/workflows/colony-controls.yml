name: Colony control and sensory contracts
on:
  push:
    paths:
      - 'schemas/software/**'
      - 'examples/*control*'
      - 'examples/*crystal*'
      - 'examples/*vision*'
      - 'tests/test_colony_control_contracts.py'
      - '.github/workflows/colony-controls.yml'
  pull_request:
    paths:
      - 'schemas/software/**'
      - 'examples/*control*'
      - 'examples/*crystal*'
      - 'examples/*vision*'
      - 'tests/test_colony_control_contracts.py'
      - '.github/workflows/colony-controls.yml'
permissions:
  contents: read
jobs:
  schema-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install jsonschema==4.26.0
      - run: python -m unittest tests.test_colony_control_contracts -v
