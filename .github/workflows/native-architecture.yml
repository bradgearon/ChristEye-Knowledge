name: Anaiero Native Architecture Guard
on:
  push:
    paths:
      - 'native/include/anaiero/**'
      - 'tests/test_native_architecture.py'
      - '.github/workflows/native-architecture.yml'
      - 'docs/software/CE-SW-20_anaiero_v0015_cpp_architecture_pass.md'
      - 'docs/software/ADR-001_native_runtime_ownership.md'
      - 'docs/software/ADR-002_native_windows_linux_parity.md'
  pull_request:
    paths:
      - 'native/include/anaiero/**'
      - 'tests/test_native_architecture.py'
      - '.github/workflows/native-architecture.yml'
      - 'docs/software/CE-SW-20_anaiero_v0015_cpp_architecture_pass.md'
      - 'docs/software/ADR-001_native_runtime_ownership.md'
      - 'docs/software/ADR-002_native_windows_linux_parity.md'
permissions:
  contents: read
jobs:
  native-boundaries:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify native layers and documented migration debts
        run: python -m unittest discover -s tests -p test_native_architecture.py -v
