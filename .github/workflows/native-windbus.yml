name: Anaiero Native WindBus SW1
on:
  push:
    paths:
      - 'native/**'
      - '.github/workflows/native-windbus.yml'
  pull_request:
    paths:
      - 'native/**'
      - '.github/workflows/native-windbus.yml'
jobs:
  native-codec:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S native -B build/native -DCE_WIND_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build/native --config Release
      - name: Test
        run: ctest --test-dir build/native -C Release --output-on-failure
