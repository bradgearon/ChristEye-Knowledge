name: SIM3.2 Model Fidelity and Frozen Holdout
on:
  push:
    paths:
      - 'native/include/christeye/living/model_fidelity.hpp'
      - 'native/examples/colony_fidelity_cli.cpp'
      - 'native/tests/colony_fidelity_*'
      - 'native/CMakeLists.txt'
      - 'examples/sim3/*.celaw'
      - 'examples/sim3/*.cevobs'
      - 'examples/sim3/*.ceveval'
      - 'examples/sim3/fidelity-*.json'
      - 'tests/test_sim32_fidelity_contract.py'
      - 'schemas/software/model_fidelity_report.v1.schema.json'
      - '.github/workflows/sim32-fidelity.yml'
  pull_request:
    paths:
      - 'native/include/christeye/living/model_fidelity.hpp'
      - 'native/examples/colony_fidelity_cli.cpp'
      - 'native/tests/colony_fidelity_*'
      - 'native/CMakeLists.txt'
      - 'examples/sim3/*.celaw'
      - 'examples/sim3/*.cevobs'
      - 'examples/sim3/*.ceveval'
      - 'examples/sim3/fidelity-*.json'
      - 'tests/test_sim32_fidelity_contract.py'
      - 'schemas/software/model_fidelity_report.v1.schema.json'
      - '.github/workflows/sim32-fidelity.yml'
permissions:
  contents: read
jobs:
  model-fidelity-native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure native C++20
        run: cmake -S native -B build/sim32 -DCE_WIND_BUILD_TESTS=ON
      - name: Compile fidelity, CLI, and colony engine
        run: cmake --build build/sim32 --config Release --target ce_colony_runner ce_colony_fidelity ce_colony_fidelity_tests
      - name: Execute model fidelity and integration tests
        run: ctest --test-dir build/sim32 -C Release --output-on-failure -R "colony_fidelity_"
  model-fidelity-schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install schema validator
        run: python -m pip install 'jsonschema>=4.18,<5'
      - name: Verify sealed fixtures and report schema
        run: python -m unittest discover -s tests -p test_sim32_fidelity_contract.py -v
